<style>
/* Layout: one phone-width column (max 480px) centred on larger screens, bottom tab bar for Today / Workout / History / Config. */
:root {
  --bg: #edf1ef;
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --ink: #14211c;
  --muted: #55645e;
  --line: #d3dcd8;
  --accent: #1b6b50;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe6;
  --amber: #8a5a00;
  --amber-soft: #f8ebcb;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #161f1b; --surface-2: #1c2723; --ink: #e5eee9; --muted: #94a59e;
    --line: #2b3833; --accent: #5bc99a; --accent-ink: #0b1a13; --accent-soft: #1f3a2f;
    --amber: #e7b84f; --amber-soft: #3a2e12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #161f1b; --surface-2: #1c2723; --ink: #e5eee9; --muted: #94a59e;
  --line: #2b3833; --accent: #5bc99a; --accent-ink: #0b1a13; --accent-soft: #1f3a2f;
  --amber: #e7b84f; --amber-soft: #3a2e12; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 480px; margin: 0 auto; padding-bottom: 96px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 4px 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.08em; text-transform: uppercase; }
.sample { font-size: 12px; color: var(--amber); background: var(--amber-soft); padding: 3px 9px; border-radius: 99px; font-weight: 500; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; margin: 6px 0 4px; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; margin: 22px 0 8px; color: var(--muted); }
.lead { color: var(--muted); margin: 0 0 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { min-height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); width: 100%; font-size: 16px; }
.btn.quiet { min-height: 38px; font-weight: 500; font-size: 14px; }
.suggest { border-left: 6px solid var(--accent); }
.eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; margin: 2px 0 6px; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip { min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 4px 2px; font-size: 13px; font-weight: 500; line-height: 1.15; position: relative; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip .tag { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.chip.done .tag { color: var(--accent); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--amber-soft); color: var(--amber); white-space: nowrap; }
.badge.green { background: var(--accent-soft); color: var(--accent); }
.badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.ex { display: grid; grid-template-columns: 38px 1fr; gap: 4px 10px; }
.pos { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--accent); text-align: center; padding-top: 2px; }
.pos.warm { font-size: 22px; color: var(--muted); }
.ex-name { font-weight: 600; font-size: 16px; }
.last { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.sets { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 6px 8px; align-items: center; }
.sets .hd { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.2; }
.sets input, .sets select { width: 100%; min-width: 0; min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; font-variant-numeric: tabular-nums; color: var(--ink); }
.sets .n { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.ctl button { min-height: 38px; min-width: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
.ctl button:disabled { opacity: 0.4; cursor: default; }
.ctl button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.field select, .addbar select { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); width: 100%; min-width: 0; }
.skipped { opacity: 0.65; }
.sug { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 12px; }
.addbar { display: flex; gap: 8px; }
.addbar select { flex: 1; }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.list { display: flex; flex-direction: column; }
.item { padding: 11px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tools select, .tools input[type="search"] { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; min-width: 0; flex: 1 1 130px; color: var(--ink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { min-height: 40px; border: 0; border-radius: 7px; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; gap: 8px; }
summary::marker { color: var(--muted); }
ol.plain { margin: 8px 0 2px; padding-left: 22px; }
ol.plain li { padding: 2px 0; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: transparent; min-height: 54px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 500; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 6; max-width: min(440px, calc(100vw - 32px)); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .tab { transition: background-color 0.15s, border-color 0.15s; } }
.btn:disabled { opacity: 0.5; cursor: default; }
.row.sec { margin: 20px 0 8px; }
.row.sec h2 { margin: 0; }
.count { font-family: var(--font-body); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 500; }
.switch { position: relative; width: 50px; height: 44px; flex: none; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch span { position: absolute; left: 0; top: 8px; width: 50px; height: 28px; border-radius: 99px; background: var(--line); pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(22px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.parts { display: flex; flex-direction: column; }
.part { padding: 10px 0; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; padding-top: 0; }
.part.off .sumline { color: var(--muted); }
.part-body { margin-top: 10px; padding-left: 60px; display: flex; flex-direction: column; gap: 8px; }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.panel ol.plain { margin-top: 6px; }
.plain-ul { margin: 8px 0 2px; padding-left: 18px; }
.plain-ul > li { padding: 3px 0; }

.field input, .field select, .field textarea, .stack textarea { width: 100%; min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; font: inherit; }
.field textarea, .stack textarea { width: 100%; font-size: 13px; }
.btn.warn { border-color: var(--amber); color: var(--ink); background: var(--amber-soft); }
.item.row { align-items: center; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="brand">Lifestyle · Gym</span>
    <span class="sample">Demo · saved on this device</span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main">

    <button class="tab" data-tab="workout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Workout</button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>

  </div>
</nav>

<script>

const SEED_GRIPS = {
  "Pull-up": ["Overhand, wide", "Overhand, shoulder width", "Underhand", "Neutral"],
  "Barbell bench press": ["Standard", "Close", "Wide"],
  "Overhead press": ["Standard", "Wide"],

  "Triceps pushdown": ["Straight bar", "Rope", "V-bar"]
};


const CARDIO_N = ["Easy run","HIIT sprints","Uphill walk","Steady bike ride","Rowing machine","Swimming laps","Stair climber","Skipping rope","Padel","Football"];
const STRETCH_N = ["Cat-cow stretch","Hip flexor stretch","Thoracic rotation","Doorway chest stretch","Hamstring stretch","Child's pose","Pigeon pose","Thread the needle","Shoulder band pass-through","Seated glute stretch","90/90 hip switch","Ankle rock","Dead bug","Bird dog","Side plank"];
const RECOVERY_N = ["Sauna","Steam room","Cold plunge","Jacuzzi"];
const TYPE_LABEL = { strength: "Strength", cardio: "Cardio", hiit: "HIIT", stretch: "Stretch", recovery: "Recovery" };
const GROUP_LABEL = { strength: "Strength", cardio: "Cardio", stretch: "Stretch", recovery: "Recovery" };
// What each exercise type logs. Every field is optional except where you choose otherwise. [key, heading, placeholder, input type]
const FIELDS = {
  strength: [["w","Weight (kg)","kg","decimal"], ["r","Reps","reps","numeric"]],
  cardio:   [["d","Time (min)","min","decimal"], ["k","Distance (km)","km","decimal"], ["i","Intensity 1–10","1–10","numeric"]],

  stretch:  [["h","Hold (s)","sec","numeric"], ["r","Reps","reps","numeric"], ["s","Side",null,"side"]],
  recovery: [["d","Time (min)","min","decimal"], ["t","Temp (°C)","°C","decimal"], ["n","Rounds","rounds","numeric"]]
};
const SEED_SESSIONS = [
  { id:"push1", name:"Push 1", cycle:true, ex:["Barbell bench press","Overhead press","Incline dumbbell press","Lateral raise","Triceps pushdown"] },
  { id:"pull1", name:"Pull 1", cycle:true, ex:["Pull-up","Barbell row","Seated cable row","Face pull","Barbell curl"] },
  { id:"legs1", name:"Legs 1", cycle:true, ex:["Back squat","Romanian deadlift","Leg press","Leg curl","Standing calf raise"] },

  { id:"legs2", name:"Legs 2", cycle:true, ex:["Front squat","Hip thrust","Bulgarian split squat","Leg extension","Standing calf raise"] },
  { id:"full2", name:"Full Body 2", cycle:true, ex:["Kettlebell swing","Overhead press","Pull-up","Walking lunge","Farmer's carry"] },
  // Outside the cycle: the longer Stretch option. The desk-job moves are pinned and never rotate.
  { id:"mobility", name:"Mobility session", pinned:["Cat-cow stretch","Hip flexor stretch","Thoracic rotation"],

// Always in the desk-job stretch block, whatever the session.
const DESK_N = ["Hip flexor stretch", "Thoracic rotation", "Doorway chest stretch"];
// Sample extras for the stretch block. Tailoring these to your workouts comes later.
const STRETCH_FOR = {
  push: ["Doorway chest stretch", "Thoracic rotation", "Shoulder band pass-through"],
  pull: ["Thread the needle", "Cat-cow stretch", "Doorway chest stretch"],
  legs: ["Hip flexor stretch", "Hamstring stretch", "90/90 hip switch", "Ankle rock"],
  full: ["Cat-cow stretch", "Hip flexor stretch", "Thoracic rotation"]
};
// Sample cardio rules, to show where suggestions will come from. Real rules need your weekly targets and history.
const CARDIO_RULES = {
  push: { ex: "Easy run",    on: true,  why: "Legs are free after a push session" },
  pull: { ex: "Uphill walk", on: true,  why: "No rowing around a back session" },
  legs: { ex: "Uphill walk", on: false, why: "Leg day: no hard cardio before or after" },
  full: { ex: "Uphill walk", on: true,  why: "Weekly uphill walk target: 0 of 2 so far" }
};
// Muscles each kind of weights session is meant to cover; used by the add suggestions.
const TARGETS = { push: ["Chest","Shoulders","Triceps"], pull: ["Back","Biceps","Rear delts"], legs: ["Quads","Hamstrings","Glutes","Calves"], full: ["Chest","Back","Quads","Hamstrings","Shoulders","Core"] };
const PARTS = ["stretch", "weights", "cardio", "recovery"];
const PART_LABEL = { stretch: "Stretch", weights: "Weights", cardio: "Cardio", recovery: "Recovery" };

/* ---------- Small helpers ---------- */

/* ---------- Reading history ---------- */
const filled = (exId, s) => Object.keys(s).filter(k => k !== "s").some(k => String(s[k]).trim() !== "");

}

  editEx: null, editSess: null, confirm: null, backupText: ""

/* ---------- Suggestions (rule-based for now: they look only at what is in the visit) ---------- */
function reasonFor(k) {

}
function swapSuggestions(item) {

  return DB.exercises.filter(c => !c.archived && !inW.has(c.id) && grpOf(c) === g).map(c => {

    if (c.muscle === e.muscle) score += 3;
    if (secs(c).some(m => sec.has(m))) score += 1;

    if (c.equipment !== e.equipment) score += 1;
    return { c, score };
  }).filter(x => x.c.muscle === e.muscle || (g === "stretch" && x.score >= 1)).sort((a, b) => b.score - a.score).slice(0, 4).map(x => ({ k: x.c.id, why: reasonFor(x.c.id) }));
}
function addSuggestions(type) {

  if (type !== "weights") {
    let list = free.filter(e => e.type !== "hiit");
    if (type === "stretch") { const d = DESK_N.map(slug); list = list.filter(e => d.includes(e.id)).concat(list.filter(e => !d.includes(e.id))); }
    return list.slice(0, 5).map(e => ({ k: e.id, why: (type === "stretch" && DESK_N.map(slug).includes(e.id) ? "Counters the desk job" : "More " + lc(PART_LABEL[type])) + " · " + lc(e.equipment) }));
  }
  const w = state.parts.weights, ws = w.on ? sessionById(w.sel) : null, targets = ws ? TARGETS[stretchKey(ws)] : null;
  if (!targets) return free.slice(0, 5).map(e => ({ k: e.id, why: reasonFor(e.id) }));
  const out = [], cov = {}; targets.concat(["Core"]).forEach(m => { cov[m] = 0; });
  W().filter(x => x.part === "weights" && !x.skipped).forEach(x => {
    const e = X(x.exId); if (e.muscle in cov) cov[e.muscle] += 1;
    secs(e).forEach(m => { if (m in cov) cov[m] += 0.5; });
  });
  targets.slice().sort((a, b) => cov[a] - cov[b]).slice(0, 3).forEach(m => {
    const c = free.filter(e => e.muscle === m);
    c.sort((a, b) => (cov[m] < 1 ? Number(b.compound) - Number(a.compound) : Number(a.compound) - Number(b.compound)));
    const why = cov[m] === 0 ? "Not worked yet: " + lc(m) : cov[m] < 2 ? "Lightly worked: " + lc(m) : "Extra " + lc(m) + " volume";
    c.slice(0, 2).forEach(e => out.push({ k: e.id, why: why + " · " + lc(e.equipment) }));
  });

}

      ${state.showLast ? lastResults() : ""}
      <div class="parts">${PARTS.map(partRow).join("")}</div>
      <div class="muted small">Once started you can reorder, swap, skip, add or remove exercises. Those changes apply to that visit only.</div>
      <button class="btn primary" data-start ${nEx ? "" : "disabled"}>${state.started ? "Continue visit" : "Start visit"} · ${nParts} part${nParts === 1 ? "" : "s"}</button>

function setsGrid(item, i, kind, e) {
  const fl = FIELDS[kind];
  const head = `<span class="hd">${kind === "cardio" || kind === "hiit" ? "Part" : kind === "recovery" ? "Round" : "Set"}</span>` + fl.map(f => `<span class="hd">${f[1]}</span>`).join("");
  const rows = item.sets.map((r, k) => `<span class="n">${k + 1}</span>` + fl.map(f => {
    const id = `${f[0]}-${i}-${k}`, label = esc(`${e.name} ${f[1]}, entry ${k + 1}`), v = r[f[0]];
    if (f[3] === "side") {
      const cur = v === undefined ? "Both" : v;
      return `<select id="${id}" data-item="${i}" data-i="${k}" data-f="${f[0]}" aria-label="${label}">${["Both", "Left", "Right"].map(o => `<option ${o === cur ? "selected" : ""}>${o}</option>`).join("")}</select>`;
    }
    return `<input id="${id}" data-item="${i}" data-i="${k}" data-f="${f[0]}" inputmode="${f[3]}" placeholder="${f[2]}" aria-label="${label}" value="${esc(v === undefined ? "" : v)}">`;
  }).join("")).join("");
  return `<div class="sets" style="grid-template-columns:34px repeat(${fl.length}, minmax(0, 1fr))">${head}${rows}</div>`;
}

function exCard(item, i, pos, glyph) {
  const L = W(), e = X(item.exId), g = e.grips || [], kind = e.type;
  const es = entriesFor(item.exId), last = es.length ? es[es.length - 1] : null, bench = last ? benchEntry(item.exId, es) : null;
  const canUp = i > 0 && L[i - 1].part === item.part, canDown = i < L.length - 1 && L[i + 1].part === item.part;
  const gripSel = g.length > 1 ? `<label class="field" for="grip-${i}">Grip<select id="grip-${i}" data-grip="${i}">${g.map(x => `<option ${x === item.grip ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>` : "";
  let swapSel = "";
  if (item.swap) {
    const inW = inWorkSet(), free = DB.exercises.filter(c => !c.archived && !inW.has(c.id));
    const sameM = free.filter(c => c.muscle === e.muscle), sameT = free.filter(c => c.muscle !== e.muscle && grpOf(c) === grpOf(e)), rest = free.filter(c => c.muscle !== e.muscle && grpOf(c) !== grpOf(e));
    const grp = (list, label) => list.length ? `<optgroup label="${esc(label)}">${list.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</optgroup>` : "";
    const sw = swapSuggestions(item).map(x => sugBtn(x.k, x.why, `data-swapto="${i}:${esc(x.k)}"`, "Swap")).join("");
    swapSel = `<div class="eyebrow" style="margin-top:10px">Suggested swaps</div><div class="stack" style="margin-top:6px">${sw || '<span class="muted small">No close matches left. Browse below.</span>'}</div><label class="field" for="swap-${i}">Browse all<select id="swap-${i}" data-swap="${i}"><option value="">Choose an exercise</option>${grp(sameM, "Same muscle (" + e.muscle + ")")}${grp(sameT, "Same type")}${grp(rest, "Other exercises")}</select></label>`;
  }
  let lastBox;
  if (!last) lastBox = `<strong>No history yet.</strong> <span class="muted">Today becomes your benchmark.</span>`;
  else {
    lastBox = `<strong>Last time:</strong> ${esc(fmt(item.exId, last.it))}${g.length > 1 && last.it.grip ? " · " + esc(last.it.grip) : ""} · ${fmtShort(last.v.date)}`;
    if (item.part === "weights" && last.it.pos) lastBox += `<br><span class="muted">Done ${ord(last.it.pos)} then${pos ? "; today it is " + ord(pos) : ""}.</span>`;
    if (g.length > 1 && item.grip && last.it.grip !== item.grip) {
      const sg = es.slice().reverse().find(x => x.it.grip === item.grip);
      lastBox += sg ? `<br><span class="muted">Last with ${esc(item.grip)}: ${esc(fmt(item.exId, sg.it))} · ${fmtShort(sg.v.date)}</span>` : `<br><span class="muted">First time with ${esc(item.grip)}.</span>`;
    }
    lastBox += `<br><span class="muted">Benchmark: ${bench === last ? "the last entry" : esc(fmt(item.exId, bench.it)) + " · " + fmtShort(bench.v.date)}</span>`;
  }
  if (kind === "hiit") lastBox += '<br><span class="muted">Suggested today: 6 rounds · 30 s work, 90 s rest. Sample only; this will use your age, fitness and history.</span>';
  const body = item.skipped ? `<div class="note">Skipped for this visit.</div>` : `
        ${gripSel}${swapSel}
        <div class="last">${lastBox}</div>
        ${setsGrid(item, i, kind, e)}
        ${kind === "strength" ? "" : '<div class="muted small" style="margin-top:6px">All fields are optional. Fill in what you have.</div>'}
        <button class="btn quiet" style="margin-top:8px" data-add="${i}">+ Add ${kind === "cardio" || kind === "hiit" ? "part" : kind === "recovery" ? "round" : "set"}</button>
        ${item.noteOpen ? `<label class="field" for="note-${i}">Note<input id="note-${i}" data-note="${i}" type="text" placeholder="Optional" value="${esc(item.note)}"></label>` : ""}`;
  const badges = (item.always ? '<span class="badge">Always on</span>' : "") + (item.skipped ? '<span class="badge">Skipped</span>' : kindBadges(item.exId));
  return `
    <article class="card ex ${item.skipped ? "skipped" : ""}">
      <div class="pos ${pos ? "" : "warm"}" aria-label="${pos ? "Position " + pos : "Not counted in the weights order"}">${pos || glyph}</div>
      <div>
        <div class="row"><span class="ex-name grow">${esc(e.name)}</span><span class="badges">${badges}</span></div>
        <div class="muted small">${esc(e.muscle)}${e.secondary ? " · " + esc(e.secondary) : ""} · ${esc(e.equipment)}</div>
        <div class="ctl" role="group" aria-label="${esc(e.name)} controls">
          <button data-up="${i}" aria-label="Move ${esc(e.name)} up" ${canUp ? "" : "disabled"}>↑</button>
          <button data-down="${i}" aria-label="Move ${esc(e.name)} down" ${canDown ? "" : "disabled"}>↓</button>
          <button data-swapbtn="${i}" aria-pressed="${item.swap}">Swap</button>
          <button data-skip="${i}">${item.skipped ? "Undo skip" : "Skip"}</button>
          <button data-notebtn="${i}" aria-pressed="${item.noteOpen}">Note${item.note ? " ✓" : ""}</button>
          <button data-remove="${i}">Remove</button>
        </div>
        ${body}
      </div>
    </article>`;
}

function workout() {
  const L = W(), quick = state.mode === "quick";
  const present = PARTS.filter(p => L.some(x => x.part === p));
  const ws = sessionById(state.parts.weights.sel);
  let pc = 0;
  const glyph = { stretch: "S", cardio: "C", recovery: "R" };
  const secsHtml = present.map(p => {
    const items = L.map((it, i) => ({ it, i })).filter(x => x.it.part === p), col = !!state.collapsed[p];
    const title = PART_LABEL[p] + (p === "weights" && !quick && ws ? " · " + esc(ws.name) : "");
    const cards = col ? "" : items.map(({ it, i }) => p === "weights" ? exCard(it, i, ++pc, "") : exCard(it, i, 0, glyph[p])).join("");
    return `<section aria-label="${PART_LABEL[p]}"><div class="row sec"><h2 class="grow">${title} <span class="count muted">${items.length}</span></h2><button class="btn quiet" data-collapse="${p}" aria-expanded="${!col}">${col ? "Show" : "Hide"}</button></div><div class="stack">${cards}</div></section>`;
  }).join("") || `<div class="card muted">Nothing in this visit yet. Add an exercise below, or switch a part on in Today.</div>`;
  const inW = inWorkSet();

  const free = DB.exercises.filter(e => !e.archived && !inW.has(e.id) && partOfEx(e) === state.addType);

    <div class="eyebrow" style="margin-top:12px">Browse all ${lc(PART_LABEL[state.addType])} exercises</div>
    <div class="addbar" style="margin-top:6px"><select id="add-ex" aria-label="Exercise to add"><option value="">Choose an exercise</option>${optsByMuscle(free)}</select><button class="btn" data-addex>Add</button></div>
    ${quick ? "" : `<label class="field" for="visit-note" style="margin-top:14px">Visit note<input id="visit-note" type="text" placeholder="Optional" value="${esc(state.visitNote)}"></label>`}
    <div style="margin-top:14px"><button class="btn quiet" data-reset>Reset to default</button></div>
    <div style="margin-top:10px"><button class="btn primary" data-finish>Finish visit</button></div>`;
}

function lastLogged() { for (let i = DB.visits.length - 1; i >= 0; i--) { const it = DB.visits[i].items.find(x => !x.skipped && X(x.exId)); if (it) return it.exId; } return null; }
function history() {
  const seg = `<div class="seg" role="group" aria-label="History view">
    <button data-hv="visits" aria-pressed="${state.histView === "visits"}">By visit</button>
    <button data-hv="exercises" aria-pressed="${state.histView === "exercises"}">By exercise</button></div>`;
  let body = "";
  if (state.histView === "visits") {
    body = DB.visits.length ? DB.visits.slice().reverse().map(v => visitCard(v, true)).join("") : `<div class="card muted">Nothing logged yet. Finished visits are listed here, newest first.</div>`;
  } else {
    const exId = state.histEx && X(state.histEx) ? state.histEx : (lastLogged() || DB.exercises[0].id);
    const e = X(exId), logged = new Set(); DB.visits.forEach(v => v.items.forEach(it => logged.add(it.exId)));
    const lo = DB.exercises.filter(x => logged.has(x.id)), no = DB.exercises.filter(x => !logged.has(x.id) && !x.archived);
    const opt = list => list.map(x => `<option value="${esc(x.id)}" ${x.id === exId ? "selected" : ""}>${esc(x.name)}</option>`).join("");
    const g = e.grips || [], gripF = g.length > 1 ? state.histGrip : "All";
    let es = entriesFor(exId); const bench = es.length ? benchEntry(exId, es) : null;
    if (gripF !== "All") es = es.filter(x => x.it.grip === gripF);
    const gripChips = g.length > 1 ? `<div class="chips" style="margin-bottom:10px" role="group" aria-label="Filter by grip">${["All"].concat(g).map(x => `<button class="chip" data-hgrip="${esc(x)}" aria-pressed="${x === gripF}">${x === "All" ? "All grips" : esc(x)}</button>`).join("")}</div>` : "";
    const rows = es.slice().reverse().map(x => `<div class="item row"><div class="grow"><strong class="num">${fmtDate(x.v.date)}</strong><div class="muted small">${esc(fmt(exId, x.it))}${g.length > 1 && x.it.grip ? " · " + esc(x.it.grip) : ""}</div>${x.it.pos ? `<div class="small muted">Done ${ord(x.it.pos)} in that visit</div>` : ""}${x.it.note ? `<div class="small muted">Note: ${esc(x.it.note)}</div>` : ""}</div>${x === bench || (bench && x.v.id === bench.v.id) ? '<span class="badge green">Benchmark</span>' : `<button class="btn quiet" data-bench="${esc(x.v.id)}">Make benchmark</button>`}</div>`).join("");
    body = `<div class="tools"><select id="hist-ex" aria-label="Choose exercise">${lo.length ? `<optgroup label="Logged">${opt(lo)}</optgroup>` : ""}<optgroup label="Not logged yet">${opt(no)}</optgroup></select></div>
      ${gripChips}
      ${rows ? `<div class="card list">${rows}</div><p class="muted small">The benchmark is the entry later sessions compare with. It starts as your first entry; move it to any entry.</p>` : `<div class="card muted">No entries yet${gripF !== "All" ? " for this grip" : ""}. Your first one becomes the benchmark.</div>`}`;
  }
  return `<h1>History</h1><p class="lead">Everything you log is kept on this device.</p>${seg}${body}`;
}

    <label class="field" for="ex-type">Type<select id="ex-type">${["strength", "cardio", "hiit", "stretch", "recovery"].map(t => `<option value="${t}" ${t === e.type ? "selected" : ""}>${TYPE_LABEL[t]}</option>`).join("")}</select></label>

    <label class="field" for="ex-second">Other muscles (comma separated)<input id="ex-second" type="text" value="${esc(e.secondary)}"></label>

    <label class="field" for="ex-grips">Grips (comma separated, first is the default)<input id="ex-grips" type="text" value="${esc((e.grips || []).join(", "))}"></label>

function saveExercise() {
  const id = state.editEx, v = n => ($("#" + n).value || "").trim();
  const name = v("ex-name"); if (!name) return toast("Give the exercise a name.");
  if (DB.exercises.some(e => lc(e.name) === lc(name) && e.id !== id)) return toast("There is already an exercise with that name.");
  const type = $("#ex-type").value;
  const data = { name, muscle: v("ex-muscle") || "Other", secondary: v("ex-second"), equipment: v("ex-equip") || "Bodyweight", type, compound: type === "strength" && $("#ex-compound").checked, grips: v("ex-grips").split(",").map(x => x.trim()).filter(Boolean) };
  if (id === "new") { let nid = slug(name) || "exercise"; while (EXM[nid]) nid += "-2"; DB.exercises.push(Object.assign({ id: nid, archived: false }, data)); }
  else Object.assign(EXM[id], data);
  indexEx(); save(); state.editEx = null; toast("Saved."); route();
}
function sessEdit(s) {
  const free = DB.exercises.filter(e => !e.archived && !s.ex.includes(e.id));
  const rows = s.ex.map((id, i) => {
    const e = X(id); if (!e) return "";
    const pinned = (s.pinned || []).includes(id);
    return `<div class="item row"><div class="grow"><strong>${esc(e.name)}</strong> ${kindBadges(id)}${pinned ? ' <span class="badge">Always on</span>' : ""}${e.archived ? ' <span class="badge">Archived</span>' : ""}</div>
      <div class="ctl" style="margin:0"><button data-sup="${esc(s.id)}:${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button><button data-sdown="${esc(s.id)}:${i}" aria-label="Move down" ${i === s.ex.length - 1 ? "disabled" : ""}>↓</button><button data-spin="${esc(s.id)}:${esc(id)}" aria-pressed="${pinned}">Pin</button><button data-srem="${esc(s.id)}:${i}">✕</button></div></div>`;
  }).join("");
  return `<div class="card" style="margin-top:8px">${rows || '<div class="muted">No exercises yet.</div>'}
    <div class="addbar" style="margin-top:10px"><select id="sess-add" aria-label="Exercise to add to ${esc(s.name)}"><option value="">Add an exercise</option>${optsByMuscle(free)}</select><button class="btn" data-sadd="${esc(s.id)}">Add</button></div>
    <p class="muted small" style="margin:8px 0 0">Pinned exercises stay at the top and never rotate. Changes apply from your next visit; use Reset to default in a visit to apply them to the one in progress.</p></div>`;
}
function config() {
  const muscles = ["All"].concat([...new Set(DB.exercises.map(e => e.muscle))].sort());

  const list = DB.exercises.filter(e => (state.muscle === "All" || e.muscle === state.muscle) && (state.kindF === "All" || GROUP_LABEL[grpOf(e)] === state.kindF) && (!q || lc(e.name).includes(q)));

  const sess = DB.sessions.map(s => `<div class="item"><div class="row"><div class="grow"><strong>${esc(s.name)}</strong><div class="muted small">${s.ex.length} exercises${s.cycle ? "" : " · outside the cycle"}</div></div><button class="btn quiet" data-editsess="${esc(s.id)}" aria-expanded="${state.editSess === s.id}">${state.editSess === s.id ? "Done" : "Edit"}</button></div>${state.editSess === s.id ? sessEdit(s) : ""}</div>`).join("");
  const nv = DB.visits.length;
  return `
    <h1>Config</h1>

    <div class="card list">${sess}</div>
    <h2>Exercises (${DB.exercises.length})</h2>
    <div class="tools">
      <input id="cfg-q" type="search" placeholder="Search exercises" aria-label="Search exercises" value="${esc(state.query)}">
      <select id="cfg-k" aria-label="Filter by type">${["All", "Strength", "Cardio", "Stretch", "Recovery"].map(m => `<option ${m === state.kindF ? "selected" : ""}>${m}</option>`).join("")}</select>
      <select id="cfg-m" aria-label="Filter by muscle">${muscles.map(m => `<option ${m === state.muscle ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
    </div>
    <div class="card list" id="cfg-list">${state.editEx === "new" ? exForm("new") : ""}${rows}</div>

    <div class="card stack">

      <div class="muted small">Your data stays in this browser on this device. Your phone and your computer keep separate logs. Copy a backup now and then and keep it somewhere safe.</div>
      <button class="btn" data-backup>Copy backup</button>
      ${state.backupText ? `<label class="field" for="backup-box">Backup text<textarea id="backup-box" rows="4" readonly>${esc(state.backupText)}</textarea></label>` : ""}
      <label class="field" for="restore-box">Restore from a backup<textarea id="restore-box" rows="3" placeholder="Paste backup text here"></textarea></label>
      <button class="btn" data-cf="restore" data-restore>${state.confirm === "restore" ? "Tap again to replace everything" : "Restore backup"}</button>
      <button class="btn warn" data-cf="erase" data-erase>${state.confirm === "erase" ? "Tap again to erase all data" : "Erase all data"}</button>
    </div>`;
}

/* ---------- Routing and events ---------- */
const TABS = ["today", "workout", "history", "config"];
const SCREENS = { today, workout, history, config };
let shownTab = null;
function route() {
  const h = location.hash.replace("#", "");
  const tab = TABS.includes(h) ? h : "today";
  if (tab === "today") state.mode = "visit";
  const y = window.scrollY;
  view.innerHTML = SCREENS[tab]();
  document.querySelectorAll(".tab").forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  window.scrollTo(0, tab === shownTab ? y : 0);
  shownTab = tab;
  persist();
}
function go(tab) { if (location.hash === "#" + tab) route(); else location.hash = tab; }
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", persist);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") persist(); });

function copyBackup() {
  const json = JSON.stringify(DB); state.backupText = json;
  const done = ok => { toast(ok ? "Backup copied. Paste it somewhere safe." : "Could not copy automatically. Select the text shown and copy it."); route(); };
  try { navigator.clipboard.writeText(json).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}
function restoreBackup() {
  let d; try { d = JSON.parse($("#restore-box").value); } catch (e) { return toast("That is not valid backup text."); }
  if (!d || d.v !== 1 || !Array.isArray(d.exercises) || !Array.isArray(d.sessions) || !Array.isArray(d.visits)) return toast("That does not look like a backup from this app.");
  DB = d; DB.bench = DB.bench || {}; DB.draft = null; indexEx(); save(); resetVisit(); state.backupText = ""; toast("Backup restored."); route();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (state.confirm && state.confirm !== d.cf) state.confirm = null;
  if (d.cf && state.confirm !== d.cf) { state.confirm = d.cf; return route(); }
  if (d.cf) state.confirm = null;
  if (d.tab) return go(d.tab);
  if (d.open) { state.open[d.open] = !state.open[d.open]; return route(); }
  if (d.pick !== undefined) { state.parts.weights.sel = d.pick; weightsChanged(); return route(); }
  if (d.smode) { state.parts.stretch.mode = d.smode; rebuildPart("stretch"); return route(); }
  if (d.rec) {
    const it = state.parts.recovery.items, k = it.indexOf(d.rec);
    if (k >= 0) it.splice(k, 1); else it.push(d.rec);
    rebuildPart("recovery"); return route();
  }
  if (d.showlast !== undefined) { state.showLast = !state.showLast; return route(); }
  if (d.quickopen !== undefined) { state.quickOpen = !state.quickOpen; return route(); }
  if (d.quickgo !== undefined) {
    const v = $("#quick-ex").value; if (!v) return;
    state.mode = "quick"; state.quickId = v; state.quick = [newItem(v)]; state.quickOpen = false;
    return go("workout");
  }
  if (d.start !== undefined) { state.started = true; state.mode = "visit"; return go("workout"); }
  if (d.collapse) { state.collapsed[d.collapse] = !state.collapsed[d.collapse]; return route(); }
  if (d.addtype) { state.addType = d.addtype; return route(); }
  if (d.add !== undefined) { W()[+d.add].sets.push({}); return route(); }
  if (d.up !== undefined) { moveItem(+d.up, -1); return route(); }
  if (d.down !== undefined) { moveItem(+d.down, 1); return route(); }
  if (d.swapbtn !== undefined) { const it = W()[+d.swapbtn]; it.swap = !it.swap; return route(); }
  if (d.skip !== undefined) { const it = W()[+d.skip]; it.skipped = !it.skipped; return route(); }
  if (d.notebtn !== undefined) { const it = W()[+d.notebtn]; it.noteOpen = !it.noteOpen; return route(); }
  if (d.remove !== undefined) { W().splice(+d.remove, 1); toast("Removed from this visit only."); return route(); }
  if (d.swapto !== undefined) { const k = d.swapto.indexOf(":"); replaceItem(+d.swapto.slice(0, k), d.swapto.slice(k + 1)); toast("Swapped for this visit only."); return route(); }
  if (d.addsug !== undefined) { W().push(newItem(d.addsug)); if (state.mode !== "quick") sortWork(); toast("Added to this visit only."); return route(); }
  if (d.addex !== undefined) {
    const v = $("#add-ex").value; if (v === "") return toast("Choose an exercise first.");
    W().push(newItem(v)); if (state.mode !== "quick") sortWork();
    toast("Added to this visit only."); return route();
  }
  if (d.reset !== undefined) {
    if (state.mode === "quick") state.quick = [newItem(state.quickId)]; else { const n = state.visitNote; buildAll(); state.visitNote = n; }
    toast("Back to the default."); return route();
  }
  if (d.finish !== undefined) return finishVisit();
  if (d.delvisit !== undefined) { DB.visits = DB.visits.filter(v => v.id !== d.delvisit); save(); toast("Visit deleted."); return route(); }
  if (d.hv) { state.histView = d.hv; return route(); }
  if (d.hgrip) { state.histGrip = d.hgrip; return route(); }
  if (d.bench !== undefined) {
    const exId = $("#hist-ex").value; DB.bench[exId] = d.bench; save(); toast("Benchmark moved."); return route();
  }
  if (d.newx !== undefined) { state.editEx = "new"; return route(); }
  if (d.editx) { state.editEx = d.editx; return route(); }
  if (d.cancelx !== undefined) { state.editEx = null; return route(); }
  if (d.savex !== undefined) return saveExercise();
  if (d.archive) { const e = X(d.archive); e.archived = !e.archived; save(); toast(e.archived ? "Archived. It stays in your history." : "Restored."); return route(); }
  if (d.editsess) { state.editSess = state.editSess === d.editsess ? null : d.editsess; return route(); }
  const sp = a => { const k = a.indexOf(":"); return [sessionById(a.slice(0, k)), a.slice(k + 1)]; };
  if (d.sup !== undefined || d.sdown !== undefined) {
    const [s, i] = sp(d.sup !== undefined ? d.sup : d.sdown), n = +i, m = d.sup !== undefined ? n - 1 : n + 1;
    if (m >= 0 && m < s.ex.length) { const x = s.ex[n]; s.ex[n] = s.ex[m]; s.ex[m] = x; save(); }
    return route();
  }
  if (d.spin !== undefined) { const [s, id] = sp(d.spin); s.pinned = s.pinned || []; const k = s.pinned.indexOf(id); if (k >= 0) s.pinned.splice(k, 1); else s.pinned.push(id); save(); return route(); }
  if (d.srem !== undefined) { const [s, i] = sp(d.srem); const id = s.ex[+i]; s.ex.splice(+i, 1); s.pinned = (s.pinned || []).filter(x => x !== id); save(); return route(); }
  if (d.sadd !== undefined) { const s = sessionById(d.sadd), v = $("#sess-add").value; if (!v) return toast("Choose an exercise first."); s.ex.push(v); save(); return route(); }
  if (d.backup !== undefined) return copyBackup();
  if (d.restore !== undefined) return restoreBackup();
  if (d.erase !== undefined) { DB = seedDB(); indexEx(); save(); resetVisit(); state.backupText = ""; toast("All data erased."); return route(); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f) { W()[+t.dataset.item].sets[+t.dataset.i][t.dataset.f] = t.value; return persistSoon(); }
  if (t.dataset && t.dataset.note !== undefined) { W()[+t.dataset.note].note = t.value; return persistSoon(); }
  if (t.id === "visit-note") { state.visitNote = t.value; return persistSoon(); }
  if (t.id === "cfg-q") { state.query = t.value; const keep = t.selectionStart; route(); const n = $("#cfg-q"); n.focus(); n.setSelectionRange(keep, keep); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f) { W()[+t.dataset.item].sets[+t.dataset.i][t.dataset.f] = t.value; return persistSoon(); }
  if (t.dataset && t.dataset.tg) {
    const p = t.dataset.tg; state.parts[p].on = t.checked;
    if (p === "cardio") state.parts.cardio.touched = true;
    if (p === "weights") weightsChanged(); else rebuildPart(p);
    return route();
  }
  if (t.id === "cardio-ex") { state.parts.cardio.ex = t.value; state.parts.cardio.touched = true; rebuildPart("cardio"); return route(); }
  if (t.dataset && t.dataset.grip !== undefined) { W()[+t.dataset.grip].grip = t.value; return route(); }
  if (t.dataset && t.dataset.swap !== undefined) {
    if (t.value === "") return;
    replaceItem(+t.dataset.swap, t.value); toast("Swapped for this visit only."); return route();
  }
  if (t.id === "cfg-m") { state.muscle = t.value; route(); }
  if (t.id === "cfg-k") { state.kindF = t.value; route(); }
  if (t.id === "hist-ex") { state.histEx = t.value; state.histGrip = "All"; route(); }
});

// Pick up a visit that was in progress when the page was last closed.
(function restoreDraft() {
  const d = DB.draft;
  if (d && d.parts && Array.isArray(d.work) && d.parts.weights && sessionById(d.parts.weights.sel)) {
    state.parts = d.parts; state.work = d.work.filter(it => X(it.exId)); state.started = !!d.started; state.visitNote = d.visitNote || "";
  } else { applyAdvice(); buildAll(); }
})();
save();
route();

</script>
</body>
</html>
